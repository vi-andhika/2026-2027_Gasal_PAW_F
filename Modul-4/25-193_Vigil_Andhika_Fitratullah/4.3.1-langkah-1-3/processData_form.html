<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <style>
    body { 
      font-family: Arial, Helvetica, sans-serif; margin: 20px; 
    }
    fieldset { 
      background: #dcdcfa; border: 1px solid #7a7ac0; width: 430px; padding: 10px 14px; 
    }
    legend { 
      font-weight: bold; 
    }
    .field { 
      display: flex; align-items: flex-start; margin: 4px 0; 
    }
    .field > label:first-child { 
      width: 120px; text-align: right; padding-right: 10px; font-size: 13px; 
    }
    .field label.inline { 
      font-size: 13px; margin-right: 8px; 
    }
  </style>
</head>
<body>
  <h1>Register</h1>
  <fieldset>
    <legend>Person Details</legend>
    <form name="myForm" action="processData.php" method="POST">
      <div class="field">
        <label for="surname">Surname</label>
        <input type="text" name="surname" id="surname" size="31"/>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="text" name="email" id="email" size="31"/>
      </div>
      <div class="field">
        <label for="passwd">Password</label>
        <input type="password" name="passwd" id="passwd" size="31"/>
      </div>
      <div class="field">
        <label for="address">Street Address</label>
        <textarea name="address" id="address" rows="3" cols="22"></textarea>
      </div>
      <div class="field">
        <label for="state">State</label>
        <select name="state" id="state">
          <option value="-1" selected>[choose your state]</option>
          <option value="1">Australian Capital Territory</option>
          <option value="2">Queensland</option>
          <option value="3">Victoria</option>
          <option value="4">New South Wales</option>
          <option value="5">Tasmania</option>
          <option value="6">South Australia</option>
          <option value="7">Western Australia</option>
          <option value="8">Northern Territory</option>
        </select>
      </div>
      <div class="field">
        <input type="hidden" name="country" value="Australia"/>
      </div>
      <div class="field">
        <label>Gender</label>
        <span>
          <input type="radio" name="sex" id="male" value="male"/><label class="inline" for="male">Male</label>
          <input type="radio" name="sex" id="female" value="female"/><label class="inline" for="female">Female</label>
        </span>
      </div>
      <div class="field">
        <label for="vegetarian">Vegetarian?</label>
        <input type="checkbox" name="vegetarian" id="vegetarian"/>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <span><input type="submit" value="Submit" name="submit"/><input type="reset" value="Reset" name="reset"/></span>
      </div>
    </form>
  </fieldset>
</body>
</html>
